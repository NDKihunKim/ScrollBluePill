<style>
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd; padding: 20px; max-width: 700px; margin: auto; }
  fieldset { border: 1px solid #444; border-radius: 6px; padding: 16px; }
  legend { font-weight: 600; color: #eee; }

  .src-row { margin-bottom: 10px; }
  .src-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.93rem; }
  .src-check input { width: 16px; height: 16px; accent-color: #3366ff; }

  .sub { margin-left: 24px; margin-top: 6px; padding: 8px 12px; border-left: 3px solid #3366ff; font-size: 0.82rem; display: none; }
  .src-check input:checked ~ .sub, .sub.show { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
  .chip.checked { border-color: #3366ff; background: rgba(51,102,255,0.15); }
  .chip input { width: 14px; height: 14px; accent-color: #3366ff; }

  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 20px; height: 20px; font-size: 0.75rem; border: 1px solid #555; border-radius: 3px; background: #2a2a2a; color: #ddd; cursor: pointer; }
  .stepper .val { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }

  .slot { background: #222; border-radius: 5px; padding: 6px 10px; margin: 4px 0; }
  .slot-label { font-weight: 600; font-size: 0.8rem; color: #c28b39; margin-bottom: 3px; }
  .slot-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .stat-r { font-size: 0.78rem; color: #bbb; }
  .stat-r input { width: 26px; padding: 1px 2px; font-size: 0.78rem; background: #333; border: 1px solid #555; border-radius: 3px; color: #ddd; text-align: center; }
</style>

<fieldset>
  <legend>분석에 사용할 강화 유형</legend>

  <!-- Scrolls (checked) -->
  <div class="src-row">
    <label class="src-check">
      <input type="checkbox" checked> 주문서
    </label>
    <div class="sub show">
      <label class="chip checked"><input type="checkbox" checked> 100%</label>
      <label class="chip checked"><input type="checkbox" checked> 60%</label>
      <label class="chip checked"><input type="checkbox" checked> 10%</label>
      <label class="chip checked"><input type="checkbox" checked> Chaos</label>
    </div>
  </div>

  <!-- Stimulant (unchecked — sub hidden) -->
  <div class="src-row">
    <label class="src-check">
      <input type="checkbox"> 촉진제
    </label>
    <div class="sub">
      delta range:
      <span class="stepper"><button>−</button><span class="val">-5</span><button>+</button></span>
      ~
      <span class="stepper"><button>−</button><span class="val">+5</span><button>+</button></span>
      <span style="color:#666;">per stat</span>
    </div>
  </div>

  <!-- Gems (unchecked) -->
  <div class="src-row">
    <label class="src-check">
      <input type="checkbox"> 보석 (메이커)
    </label>
    <div class="sub" style="color:#888;">all grades &amp; types</div>
  </div>

  <!-- Item Level-Up (checked) -->
  <div class="src-row">
    <label class="src-check">
      <input type="checkbox"> 레벨업
    </label>
    <div class="sub show" style="display:block;">
      <div style="margin-bottom:4px;color:#aaa;">리버스 람피온 · 2 remaining levels</div>
      <div class="slot">
        <div class="slot-label">Slot 1</div>
        <div class="slot-stats">
          <span class="stat-r">STR <input value="0">~<input value="1"></span>
          <span class="stat-r">DEX <input value="0">~<input value="1"></span>
          <span class="stat-r">공격력 <input value="0">~<input value="2"></span>
        </div>
      </div>
      <div class="slot">
        <div class="slot-label">Slot 2</div>
        <div class="slot-stats">
          <span class="stat-r">STR <input value="0">~<input value="1"></span>
          <span class="stat-r">DEX <input value="0">~<input value="1"></span>
          <span class="stat-r">공격력 <input value="0">~<input value="2"></span>
        </div>
      </div>
    </div>
  </div>

</fieldset>
